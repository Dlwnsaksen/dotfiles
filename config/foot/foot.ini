shell=fish
title=foot
font=JetBrainsMono Nerd Font:size=20
letter-spacing=0
dpi-aware=no
pad=25x25
bold-text-in-bright=no
gamma-correct-blending=no

[scrollback]
lines=10000

[cursor]
style=beam
beam-thickness=1.5

# Chrome Gray — neutral dark gray + Chrome blue accent (#8ab4f8)
# Defined in both colors-dark and colors-light so it looks the same
# regardless of the system light/dark preference.

[colors-dark]
alpha=0.9
background=2b2b2b
foreground=e0e0e0
regular0=3c3c3c
regular1=e08a84
regular2=9ab89a
regular3=c9b88f
regular4=8ab4f8
regular5=b89ac0
regular6=8ac0c8
regular7=cccccc
bright0=545454
bright1=f0a098
bright2=aac8aa
bright3=ddccA0
bright4=aac8ff
bright5=c8aad0
bright6=a0d0d8
bright7=f0f0f0

[colors-light]
alpha=0.9
background=2b2b2b
foreground=e0e0e0
regular0=3c3c3c
regular1=e08a84
regular2=9ab89a
regular3=c9b88f
regular4=8ab4f8
regular5=b89ac0
regular6=8ac0c8
regular7=cccccc
bright0=545454
bright1=f0a098
bright2=aac8aa
bright3=ddccA0
bright4=aac8ff
bright5=c8aad0
bright6=a0d0d8
bright7=f0f0f0

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
search-start=Control+Shift+f

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G
