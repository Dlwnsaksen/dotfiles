# LG gram 16Z95U: the AMD SoundWire sink defaults to api.alsa.headroom=0, which
# keeps the device buffer nearly empty and makes playback underrun (stutter)
# whenever the system has a brief latency spike under load. Add buffer headroom
# to absorb those spikes. Latency cost (~85 ms) is irrelevant for music/video.
# Remove this file + `systemctl --user restart wireplumber` to revert.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.pci-.*-platform-amd_sdw\\..*" }
      { node.name = "~alsa_input.pci-.*-platform-amd_sdw\\..*" }
    ]
    actions = {
      update-props = {
        api.alsa.headroom = 4096
      }
    }
  }
]
