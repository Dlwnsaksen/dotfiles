[main]
font=JetBrainsMono Nerd Font:size=14
dpi-aware=no
width=35
lines=10
terminal=foot
layer=overlay
exit-on-keyboard-focus-loss=yes
icons-enabled=yes
icon-theme=hicolor

# Chrome Gray — neutral grays + Chrome blue accent (#8ab4f8)
[colors]
background=2b2b2bee
text=e0e0e0ff
prompt=8ab4f8ff
input=e0e0e0ff
placeholder=808080ff
counter=808080ff
match=8ab4f8ff
selection=545454ff
selection-text=f0f0f0ff
selection-match=aac8ffff
border=8ab4f8aa

[border]
width=1
radius=8
